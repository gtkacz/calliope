services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: calliope
      POSTGRES_PASSWORD: calliope
      POSTGRES_DB: calliope
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - calliope_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calliope -d calliope"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CALLIOPE_DATABASE_URL: postgresql+psycopg://calliope:calliope@postgres:5432/calliope
    entrypoint: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # Run as root so rootless podman maps the container to the HOST user, who owns
    # the bind-mounted browse root (a 0700 home dir is unreadable to the image's
    # unprivileged uid 10001). Under rootless podman "root" is your host user, not
    # real root, so this grants no extra host privilege. Mirrors compose.dev.yml.
    # Under Docker rootful this runs as real root; files written to the mount are
    # then root-owned on the host — acceptable for this local-first tool.
    user: root
    environment:
      CALLIOPE_DATABASE_URL: postgresql+psycopg://calliope:calliope@postgres:5432/calliope
      CALLIOPE_CORS_ORIGINS: ${CALLIOPE_CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      CALLIOPE_LLM_REQUEST_TIMEOUT_SECONDS: ${CALLIOPE_LLM_REQUEST_TIMEOUT_SECONDS:-120}
      # Folder the in-app picker opens on; it can only browse paths that are
      # bind-mounted in (see the volume below). Keep it in sync with the mount.
      CALLIOPE_BROWSE_ROOT: ${CALLIOPE_BROWSE_ROOT:-/var/tmp/calliope-notes}
      # Provider API keys forwarded to the backend so a connection profile whose
      # "API key (env var)" names one of these can authenticate. The profile
      # references the env-var NAME (e.g. OPENAI_API_KEY); the value lives in .env.
      # Unset keys pass through empty and are ignored (local Ollama/LM Studio need none).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    # Symmetric bind mount so absolute paths pasted into the UI's "Workspace
    # root" field resolve to the same path inside the container. Set
    # CALLIOPE_BROWSE_ROOT to the host directory you want to reach — e.g.
    # `CALLIOPE_BROWSE_ROOT="$HOME" docker compose up` to browse your whole home.
    # The default lives under /var/tmp so rootless podman can auto-create it.
    # Mounted read-WRITE so in-app edits (LLM appends/overwrites to markdown files)
    # persist back to host files via the filesystem write API.
    volumes:
      - "${CALLIOPE_BROWSE_ROOT:-/var/tmp/calliope-notes}:${CALLIOPE_BROWSE_ROOT:-/var/tmp/calliope-notes}:rw"
    # Read the bind mount under enforcing SELinux (Fedora) without relabeling the
    # host tree. The ":z"/":Z" suffixes would relabel the mounted directory to
    # container_file_t — fine for a dedicated dir, but destructive when
    # CALLIOPE_BROWSE_ROOT points at your home. Disabling the label confines by
    # Unix permissions only, mutating nothing on the host.
    security_opt:
      - label=disable
    # host.docker.internal lets the backend reach OpenAI-compatible services
    # (Ollama, etc.) running on the host. Podman provides host.containers.internal
    # natively; this mapping keeps profile URLs portable across both engines.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        VITE_CALLIOPE_API_BASE_URL: ${VITE_CALLIOPE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  calliope_pgdata:
