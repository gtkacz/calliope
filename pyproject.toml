[project]
name = "calliope"
version = "0.1.0"
description = "Local markdown knowledge backend for worldbuilding canon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "httpx>=0.27",
  "markdown-it-py>=3.0",
  "pgvector>=0.3",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-frontmatter>=1.1",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-httpx>=0.30",
  "pyright>=1.1",
  "ruff>=0.6",
  "testcontainers[postgres]>=4.8",
]

[project.scripts]
calliope = "calliope.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend/calliope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src/backend", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
